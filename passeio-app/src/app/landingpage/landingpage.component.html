<div class="bg-gradient-to-r from-blue-500 to-blue-700 text-white p-6 shadow-lg flex flex-col justify-center items-center">
  <!-- <div class="bg-gradiente-to-r from-blue-500 to-blue-700 text-white min-h-screen flex flex-col justify-center items-center"> -->
  <div class="text-center px-6">
    <h1 class="text-4xl font-bold mb-4 ">
      Bem vindo à sua lista de lugares favoritos!!!
    </h1>
    <p class="text-lg mb-6">
      Explore, organize e compartilhe os lugares incriveis que você adora. Tudo em um só lugar.
    </p>

    <!-- Aparece quando o usuario está de fato logado -->
    <button (click)="navegar();" *ngIf="isLoggedIn()" class="bg-white text-blue-700 font-semibold py-3 px-8 rounded-full hover:bg-gray-100 flex space-x-3 items-center">
      Olá {{ profile?.name }}, clique aqui para aproveitar o site
    </button>

    <!-- É exibido quando o usuario não está logado -->
    <button (click)="logarComGoogle();" *ngIf="!isLoggedIn()" class="bg-white text-blue-700 font-semibold py-3 px-8 rounded-full hover:bg-gray-100 flex space-x-3 items-center">
      <img src="../../assets/google-logo.png" alt="google-logo" width="50px">
      Logar com Google
    </button>
  </div>
</div>
